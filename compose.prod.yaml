# Prod : Caddy (HTTPS + mot de passe) devant l'app, Ollama installé sur le serveur.
services:
  app:
    restart: unless-stopped
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Aucun port publié : seul Caddy est joignable depuis internet.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?définis DOMAIN dans .env}
      AUTH_USER: ${AUTH_USER:?définis AUTH_USER dans .env}
      AUTH_HASH: ${AUTH_HASH:?définis AUTH_HASH dans .env (caddy hash-password)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificats Let's Encrypt
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
