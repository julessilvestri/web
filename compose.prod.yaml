# Prod : Caddy (HTTPS + mot de passe) devant l'app, Ollama dans la stack.
services:
  app:
    restart: unless-stopped
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    # Aucun port publié : seul Caddy est joignable depuis internet.

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes:
      - ollama:/root/.ollama    # volume existant : llama3.2 + nomic-embed-text
    ports:
      - "127.0.0.1:11434:11434" # serveur uniquement → tunnel SSH du dev

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?définis DOMAIN dans .env}
      AUTH_USER: ${AUTH_USER:?définis AUTH_USER dans .env}
      AUTH_HASH: ${AUTH_HASH:?définis AUTH_HASH dans .env (caddy hash-password)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificats Let's Encrypt
      - caddy_config:/config

volumes:
  ollama:
    external: true              # créé par l'ancien `docker run … -v ollama:…`
  caddy_data:
  caddy_config:
