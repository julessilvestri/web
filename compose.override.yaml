# Dev : code monté + rechargement auto.
# Réseau de l'hôte pour joindre l'Ollama du serveur via le tunnel SSH sur 127.0.0.1:11434.
services:
  app:
    network_mode: host
    command: ["uvicorn", "server:app", "--host", "127.0.0.1", "--port", "${PORT:-8000}", "--reload"]
    volumes:
      - ./server.py:/app/server.py
      - ./cerveau.py:/app/cerveau.py
      - ./public:/app/public
